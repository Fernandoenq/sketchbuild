<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SketchBuild -- Visualizador 3D</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #14161a;
      --panel: #1d2026;
      --border: #2c3038;
      --text: #e6e8eb;
      --muted: #9aa1ab;
      --accent: #4f8cff;
      --error: #ff5c5c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
    #viewport { position: fixed; inset: 0; }
    #panel {
      position: absolute; top: 16px; left: 16px; z-index: 10;
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      padding: 14px 16px; width: min(420px, calc(100vw - 32px));
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    #panel h1 { font-size: 14px; margin: 0 0 10px; font-weight: 600; color: var(--text); }
    #panel .row { display: flex; gap: 8px; }
    #path-input {
      flex: 1; background: #111316; border: 1px solid var(--border); color: var(--text);
      border-radius: 6px; padding: 8px 10px; font-size: 13px; min-width: 0;
    }
    #open-btn {
      background: var(--accent); color: white; border: none; border-radius: 6px;
      padding: 8px 14px; font-size: 13px; cursor: pointer; white-space: nowrap;
    }
    #open-btn:disabled { opacity: .5; cursor: default; }
    #status { margin-top: 10px; font-size: 12px; color: var(--muted); line-height: 1.5; }
    #status.error { color: var(--error); }
    hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
    #edit-panel.hidden { display: none; }
    #edit-panel .row { margin-bottom: 8px; }
    #edit-panel label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 4px; }
    .mode-btn {
      background: #111316; border: 1px solid var(--border); color: var(--text);
      border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer;
    }
    .mode-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
    #save-btn {
      background: #2e7d32; color: white; border: none; border-radius: 6px;
      padding: 8px 14px; font-size: 13px; cursor: pointer; white-space: nowrap;
    }
    #save-btn:disabled { opacity: .5; cursor: default; }
    #selected-label { font-size: 12px; color: var(--text); margin-bottom: 8px; }
  </style>
</head>
<body>
  <div id="viewport"></div>

  <div id="panel">
    <h1>SketchBuild -- Visualizador 3D standalone</h1>
    <div class="row">
      <input id="path-input" type="text" placeholder="C:\caminho\para\arquivo.skp" />
      <button id="open-btn">Abrir</button>
    </div>
    <div id="status">Informe o caminho de um .skp e clique em Abrir.</div>

    <div id="edit-panel" class="hidden">
      <hr />
      <div id="selected-label">Nenhuma instancia selecionada.</div>
      <div class="row">
        <button class="mode-btn" data-mode="translate">Mover (W)</button>
        <button class="mode-btn" data-mode="rotate">Girar (E)</button>
        <button class="mode-btn" data-mode="scale">Escalar (R)</button>
      </div>
      <hr />
      <div class="row">
        <input id="save-path-input" type="text" placeholder="(vazio = sobrescreve o arquivo aberto)" />
        <button id="save-btn">Salvar</button>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
